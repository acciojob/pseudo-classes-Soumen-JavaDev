<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Pseudo Classes</title>

  <style>
    :root {
      background-color: rgb(135, 206, 235);
    }

    body {
      margin: 20px;
      font-family: Arial, sans-serif;
    }

    /* Article paragraphs */
    article p:first-child {
      color: white;
      background-color: black;
    }

    article p:nth-child(2) {
      color: black;
    }

    article p:last-child {
      color: red;
    }

    /* List items */
    ul li {
      background-color: gray;
      width: 50%;
      padding: 10px;
    }

    ul li:nth-child(odd) {
      background-color: white;
    }

    /* First and last items */
    ul li:first-child,
    ul li:last-child {
      font-size: 22px;
    }

    /* Third item */
    ul li:nth-child(3) {
      background-color: pink;
    }
  </style>
</head>

<body>

  <article>
    <p>First paragraph</p>
    <p>Second paragraph</p>
    <p>Third paragraph</p>
  </article>

  <h2>Topic Tags</h2>

  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
    <li>React</li>
    <li>Web Development</li>
  </ul>

</body>
</html>
